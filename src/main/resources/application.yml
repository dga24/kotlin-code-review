server:
  port: ${SERVER_PORT:8080}

spring:
  main:
    web-application-type: servlet
  datasource:
    url: ${DB_URL:jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driverClassName: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:password}
  jpa:
    database-platform: "org.hibernate.dialect.H2Dialect"
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: ${H2_CONSOLE_PATH:/h2-console}
      settings:
        trace: false
        web-allow-others: false

# ==================================================================
# API Doc / Swagger
# ==================================================================

spring-doc:
  pathsToMatch: /api/**
  show-actuator: true
  swagger-ui.enabled: ${SWAGGER_ENABLED:true}

  api-docs:
    path: ${API_DOCS_PATH:/api-docs}
